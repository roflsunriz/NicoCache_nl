<!doctype html>
<html lang="ja" data-fixture="watch">
<head>
  <meta charset="utf-8">
  <title>nlFilter Lab - 視聴ページ</title>
  <style>
    :root { color-scheme: light; font-family: "Yu Gothic UI", sans-serif; color: #20242d; background: #f2f4f7; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    #CommonHeader { position: sticky; top: 0; z-index: 1000; min-height: 36px; background: #252525; }
    .nico-CommonHeaderRoot { display: flex; height: 36px; align-items: center; justify-content: space-between; color: #fff; }
    [data-lab-service-nav] { display: flex; height: 36px; padding-left: 22px; align-items: center; }
    [data-lab-service-nav] > a { height: 36px; padding: 0 6px; color: #ddd; font-size: 12px; line-height: 36px; }
    [data-lab-official-other] { position: relative; height: 36px; padding: 0 6px; color: #fff; font-size: 12px; line-height: 36px; }
    [data-lab-account] { padding-right: 22px; color: #ddd; font-size: 12px; }
    main { width: min(1120px, calc(100% - 28px)); margin: 22px auto; }
    .player-shell { aspect-ratio: 16 / 7; display: grid; place-items: center; border-radius: 12px; background: #11151c; color: white; }
    video { width: min(70%, 720px); height: 70%; background: #050608; }
    .content-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr); gap: 22px; margin-top: 20px; }
    .panel { border: 1px solid #d7dce4; border-radius: 10px; padding: 16px; background: white; }
    .video-list { display: grid; gap: 12px; }
    .video-card, .VideoMediaObject { display: grid; grid-template-columns: 132px 1fr; gap: 12px; position: relative; }
    .VideoMediaObject-thumbnail, .Thumbnail { display: block; position: relative; }
    img { display: block; width: 100%; border-radius: 7px; }
    a { color: #2464a8; text-decoration: none; }
    .VideoMediaObject-title { align-self: center; font-weight: 700; }
    @media (max-width: 840px) {
      [data-lab-service-nav] { display: none; }
      .content-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="CommonHeader">
    <div class="nico-CommonHeaderRoot">
      <nav data-lab-service-nav aria-label="公式サービス">
        <a href="https://www.nicovideo.jp/video_top?cmnhd_ref=pos%3Dheader_servicelink">動画</a>
        <a href="https://seiga.nicovideo.jp/?cmnhd_ref=pos%3Dheader_servicelink">静画</a>
        <a href="https://live.nicovideo.jp/?cmnhd_ref=pos%3Dheader_servicelink">生放送</a>
        <a href="https://anime.nicovideo.jp/?cmnhd_ref=pos%3Dheader_servicelink">Nアニメ</a>
        <div data-lab-official-other>その他⌄</div>
      </nav>
      <div data-lab-account>ログイン</div>
    </div>
  </div>
  <meta name="server-response" content="{&quot;meta&quot;:{&quot;status&quot;:200},&quot;data&quot;:{&quot;response&quot;:{&quot;video&quot;:{&quot;id&quot;:&quot;sm9&quot;,&quot;title&quot;:&quot;テスト動画&quot;}}}}">
  <main>
    <section class="player-shell">
      <div><div><div><div><div id="lab-video-slot"></div></div></div></div></div>
    </section>
    <div class="content-grid">
      <section class="panel">
        <h1>テスト動画 sm9</h1>
        <p>説明欄にあるURL: https://www.nicovideo.jp/watch/sm83</p>
        <p><a href="/watch/sm9">現在の動画へのリンク</a></p>
      </section>
      <aside class="panel">
        <h2>関連動画</h2>
        <div class="video-list" data-lab-spa-target>
          <article class="video-card Pressable" data-anchor-page="watch" data-anchor-href="/watch/sm83" data-decoration-video-id="sm83">
            <a href="/watch/sm83"><span class="VideoMediaObject-thumbnail"><img src="/thumbnails/sm83.svg" alt=""></span></a>
            <a href="/watch/sm83">関連動画 sm83</a>
          </article>
          <article class="video-card Pressable" data-anchor-page="watch" data-anchor-href="/watch/sm2057168" data-decoration-video-id="sm2057168">
            <a href="https://www.nicovideo.jp/watch/sm2057168"><span class="VideoMediaObject-thumbnail"><img src="/thumbnails/sm2057168.svg" alt=""></span></a>
            <a href="/watch/sm2057168">関連動画 sm2057168</a>
          </article>
        </div>
      </aside>
    </div>
  </main>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      setTimeout(function() {
        var video = document.createElement("video");
        video.dataset.name = "video-content";
        video.controls = true;
        document.querySelector("#lab-video-slot").append(video);
      }, 0);
    });
  </script>
</body>
</html>
