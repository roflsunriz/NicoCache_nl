name: ドキュメント報告
description: 説明の誤り、不足、分かりにくい手順を報告します。
title: '[Docs] '
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |-
        文書の該当箇所と、現在の問題・期待する説明を共有してください。
        導入・利用・開発方法は [README](https://github.com/roflsunriz/NicoCache_nl/blob/HEAD/README.md) を確認してください。
        本文と添付に秘密情報や個人情報を含めないでください。脆弱性の詳細は公開せず、[セキュリティ方針](https://github.com/roflsunriz/NicoCache_nl/blob/HEAD/SECURITY.md) を確認してください。
  - type: checkboxes
    id: preflight
    attributes:
      label: 事前確認
      options:
        - label: 同じ内容の既存Issueを検索しました。
          required: true
        - label: READMEと関連する利用・更新手順を確認しました。
          required: true
  - type: dropdown
    id: area
    attributes:
      label: 対象領域
      options:
        - ドキュメント
    validations:
      required: true
  - type: dropdown
    id: document
    attributes:
      label: 対象ドキュメント
      options:
        - README
        - NicoCache_nl USAGE GUIDE
        - API仕様
        - TLS・証明書
        - 更新手順
        - Windows / Linux / macOS 配布手順
        - nlFilter / nlFilter Lab
        - その他
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: 該当箇所
      description: URL、ファイルパス、見出し名などを書いてください。
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 現在の問題
      description: 誤っている内容、迷った点、再現できなかった手順を説明してください。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する説明
      description: 正しい内容や、追加すると理解しやすい情報が分かれば書いてください。
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: 補足
      description: 参考資料やスクリーンショットがあれば添付してください。
  - type: checkboxes
    id: privacy
    attributes:
      label: 公開情報の確認
      options:
        - label: 本文・ログ・画像・添付から、認証情報、Cookie、トークン、秘密鍵、個人情報を除いたことを確認しました。
          required: true
