title: '[質問] '
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |-
        実現したいこと、確認・試行したこと、環境を共有してください。再現可能な不具合はIssueの不具合報告へお願いします。
        導入・利用・開発方法は [README](https://github.com/roflsunriz/NicoCache_nl/blob/HEAD/README.md) を確認してください。
        本文と添付に秘密情報や個人情報を含めないでください。脆弱性の詳細は公開せず、[セキュリティ方針](https://github.com/roflsunriz/NicoCache_nl/blob/HEAD/SECURITY.md) を確認してください。
  - type: markdown
    attributes:
      value: |
        導入や使い方の質問用です。秘密情報を含む設定、Cookie、証明書、未確認のログは
        投稿しないでください。不具合を再現できる場合はIssueの不具合報告を使用してください。
  - type: textarea
    id: question
    attributes:
      label: 質問
      description: 最終的に実現したいことと、分からない点を具体的に書いてください。
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: 確認・試行したこと
      description: 読んだ文書、変更した設定、表示されたメッセージを秘密情報を除いて書いてください。
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NicoCache_nlの版
      placeholder: 現在使用している版を記入してください
      description: ランチャー、GUI、配布ファイル名で確認できる使用中の版を書いてください。公開版と導入版が異なる場合は両方を記載してください。
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows
        - Linux
        - macOS
        - その他・不明
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: 補足
      description: 匿名化済みの画面や診断情報があれば添付してください。
  - type: checkboxes
    id: privacy
    attributes:
      label: 公開情報の確認
      options:
        - label: 本文・ログ・画像・添付から、認証情報、Cookie、トークン、秘密鍵、個人情報を除いたことを確認しました。
          required: true
