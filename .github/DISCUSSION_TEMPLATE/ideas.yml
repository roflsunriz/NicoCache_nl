title: "[提案] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        実装方法だけでなく、誰のどの問題を解決したいかを共有してください。
        合意した提案は、実装用Issueへ整理することがあります。
  - type: textarea
    id: problem
    attributes:
      label: 解決したい問題
      description: 現在どのように困っているか、具体的な利用場面を説明してください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案する解決方法
      description: 利用者が最終的に何を操作・確認できる状態を期待しますか。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 対象領域
      options:
        - キャッシュ・プロキシー本体 / API
        - ランチャー・初回セットアップ
        - 診断アプリ
        - 独立アップデーター
        - Windows / Linux / macOS 配布
        - 標準 nlFilter / nlFilter Lab
        - ブラウザー表示・ローカル資産
        - ドキュメント
        - プロジェクト運用
        - その他・判断できない
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案と互換性
      description: 試した回避策や、既存利用者・設定・保存データへの影響があれば書いてください。
  - type: textarea
    id: additional
    attributes:
      label: 補足
      description: 参考URL、画面案、類似機能などがあれば添付してください。
