title: '[雑談] '
body:
  - type: markdown
    attributes:
      value: |-
        共有や相談の背景を説明してください。使い方の質問や機能提案は、対応する受付を選んでください。
        導入・利用・開発方法は [README](https://github.com/roflsunriz/NicoCache_nl/blob/HEAD/README.md) を確認してください。
        本文と添付に秘密情報や個人情報を含めないでください。脆弱性の詳細は公開せず、[セキュリティ方針](https://github.com/roflsunriz/NicoCache_nl/blob/HEAD/SECURITY.md) を確認してください。
  - type: markdown
    attributes:
      value: |
        NicoCache_nlに関する共有や、Q&A・機能提案に当てはまらない話題のためのフォームです。
        使い方の質問はQ&A、新機能の提案はIdeasを選ぶと見つけてもらいやすくなります。
  - type: textarea
    id: topic
    attributes:
      label: 話したいこと
      description: 背景を含め、他の人が内容を理解できるように書いてください。
      placeholder: 共有したい内容、気付いたこと、相談したい背景など
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 関係する領域
      options:
        - キャッシュ・プロキシー本体 / API
        - ランチャー・初回セットアップ
        - 診断アプリ
        - 独立アップデーター
        - Windows / Linux / macOS 配布
        - 標準 nlFilter / nlFilter Lab
        - ブラウザー表示・ローカル資産
        - ドキュメント
        - プロジェクト運用
        - その他
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: 補足
      description: 関連する背景、参考URLなど。
  - type: checkboxes
    id: privacy
    attributes:
      label: 公開情報の確認
      options:
        - label: 本文・ログ・画像・添付から、認証情報、Cookie、トークン、秘密鍵、個人情報を除いたことを確認しました。
          required: true
