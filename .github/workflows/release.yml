name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 既存のリリースタグ
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
      app_version: ${{ steps.release-tag.outputs.app_version }}
      updater_version: ${{ steps.updater-version.outputs.updater_version }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Show release source revision
        shell: pwsh
        run: git show -s --format="commit=%H%ncommitted=%cI%nsubject=%s" HEAD

      - name: Set up JDK 11
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '11'

      - name: Check out nlFilters 01-20 source files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: roflsunriz/nlFilters
          ref: main
          path: nlFilters
          persist-credentials: false

      - name: Show nlFilters source revision
        shell: pwsh
        run: git -C nlFilters show -s --format="commit=%H%ncommitted=%cI%nsubject=%s" HEAD

      - name: Validate release tag
        id: release-tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) {
            throw "リリースタグが指定されていません"
          }
          if ($env:RELEASE_TAG -notmatch '^v(?<major>\d+)\.(?<minor>\d+)\.(?<build>\d+)$') {
            throw "リリースタグは v<major>.<minor>.<build> 形式で指定してください: $env:RELEASE_TAG"
          }
          if ([int]$Matches.major -gt 255 -or
              [int]$Matches.minor -gt 255 -or
              [int]$Matches.build -gt 65535) {
            throw "MSIで利用できる版の範囲を超えています: $env:RELEASE_TAG"
          }
          "tag=$env:RELEASE_TAG" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "app_version=$($env:RELEASE_TAG.Substring(1))" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Validate standalone updater version
        id: updater-version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw -LiteralPath .\updater\VERSION).Trim()
          if ($version -notmatch '^(?<major>\d+)\.(?<minor>\d+)\.(?<build>\d+)$') {
            throw "アップデーター版は <major>.<minor>.<build> 形式で指定してください: $version"
          }
          if ([int]$Matches.major -gt 255 -or
              [int]$Matches.minor -gt 255 -or
              [int]$Matches.build -gt 65535) {
            throw "MSIで利用できるアップデーター版の範囲を超えています: $version"
          }
          "updater_version=$version" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build NicoCache_nl.jar
        shell: pwsh
        run: .\build-javac.ps1

      - name: Run functional and Extension ABI tests
        shell: pwsh
        run: .\test-functional.ps1 -KeepWorkDir

      - name: Upload functional test diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: functional-test-diagnostics
          if-no-files-found: ignore
          include-hidden-files: true
          path: .test-work/functional

      - name: Create release checksum
        shell: pwsh
        run: |
          $jarPath = Join-Path $env:GITHUB_WORKSPACE 'NicoCache_nl.jar'
          if (-not (Test-Path -LiteralPath $jarPath -PathType Leaf)) {
            throw "ビルド成果物がありません: $jarPath"
          }
          $hash = (Get-FileHash -LiteralPath $jarPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  NicoCache_nl.jar" | Out-File -FilePath (Join-Path $env:GITHUB_WORKSPACE 'NicoCache_nl.jar.sha256') -Encoding ascii

      - name: Create distribution archive
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          $workspace = (Resolve-Path -LiteralPath $env:GITHUB_WORKSPACE).Path
          $staging = Join-Path $env:RUNNER_TEMP 'nicocache-release'
          $archivePath = Join-Path $workspace ("NicoCache_nl-$env:RELEASE_TAG.zip")

          if (Test-Path -LiteralPath $staging) {
            Remove-Item -LiteralPath $staging -Recurse -Force
          }
          New-Item -ItemType Directory -Path $staging | Out-Null

          $paths = @(git -c core.quotePath=false ls-files --cached --others --exclude-standard)
          $paths += 'NicoCache_nl.jar'
          foreach ($relativePath in $paths) {
            if ([string]::IsNullOrWhiteSpace($relativePath)) {
              continue
            }
            $sourcePath = Join-Path $workspace ($relativePath -replace '/', '\')
            $sourceItem = Get-Item -LiteralPath $sourcePath -Force -ErrorAction SilentlyContinue
            if (-not $sourceItem) {
              throw "アーカイブ対象が見つかりません: $relativePath"
            }
            if ($sourceItem.LinkType) {
              Write-Output "シンボリックリンクを除外: $relativePath"
              continue
            }
            if ($sourceItem.PSIsContainer) {
              throw "ファイルではないアーカイブ対象です: $relativePath"
            }

            $destinationPath = Join-Path $staging ($relativePath -replace '/', '\')
            $destinationDirectory = Split-Path -Parent $destinationPath
            New-Item -ItemType Directory -Path $destinationDirectory -Force | Out-Null
            Copy-Item -LiteralPath $sourcePath -Destination $destinationPath -Force
          }

          $filterRoot = Join-Path $workspace 'nlFilters'
          $filterCandidates = @(Get-ChildItem -LiteralPath $filterRoot -File -Filter '*.txt' |
            Where-Object { $_.Name -match '^(0[1-9]|1[0-9]|20)(?:\D|$)' })
          $filterCandidates | Where-Object LinkType | ForEach-Object {
            Write-Output "シンボリックリンクを除外: nlFilters/$($_.Name)"
          }
          $filterFiles = @($filterCandidates | Where-Object { -not $_.LinkType })
          if ($filterFiles.Count -eq 0) {
            throw 'nlFilters の 01-20 番台 .txt がありません'
          }
          foreach ($filterFile in $filterFiles) {
            $filterDestination = Join-Path $staging (Join-Path 'nlFilters' $filterFile.Name)
            New-Item -ItemType Directory -Path (Split-Path -Parent $filterDestination) -Force | Out-Null
            Copy-Item -LiteralPath $filterFile.FullName -Destination $filterDestination -Force
          }

          $archiveInputs = @(Get-ChildItem -LiteralPath $staging -Force | Select-Object -ExpandProperty FullName)
          if ($archiveInputs.Count -eq 0) {
            throw 'アーカイブ対象がありません'
          }
          Compress-Archive -LiteralPath $archiveInputs -DestinationPath $archivePath -CompressionLevel Optimal -Force
          Write-Output "作成したアーカイブ: $archivePath"

      - name: Set up JDK 17 for Windows installer
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Windows packaging tool versions
        shell: pwsh
        run: |
          java --version
          jpackage --version
          Get-Command candle, light | Select-Object Name, Source

      - name: Test Windows setup script
        shell: pwsh
        run: .\packaging\windows\test-windows-setup-script.ps1

      - name: Build release app image and MSI
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.release-tag.outputs.app_version }}
        run: |
          .\packaging\windows\build-windows-package.ps1 `
            -PackageType All `
            -AppVersion $env:APP_VERSION `
            -NlFiltersSource .\nlFilters

      - name: Test release MSI structure
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.release-tag.outputs.app_version }}
        run: |
          .\packaging\windows\test-windows-msi-structure.ps1 `
            -MsiPath (
              ".\.test-work\windows-package\output\NicoCache_nl-$env:APP_VERSION.msi"
            )

      - name: Test release app image
        shell: pwsh
        run: |
          .\packaging\windows\test-windows-app-image.ps1 `
            -AppImagePath .\.test-work\windows-package\output\NicoCache_nl

      - name: Test release Windows integration and rollback
        shell: pwsh
        run: |
          .\packaging\windows\test-windows-first-run.ps1 `
            -AppImagePath .\.test-work\windows-package\output\NicoCache_nl

      - name: Create MSI checksum
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.release-tag.outputs.app_version }}
        run: |
          $msi = Join-Path $env:GITHUB_WORKSPACE (
            ".test-work\windows-package\output\NicoCache_nl-$env:APP_VERSION.msi"
          )
          if (-not (Test-Path -LiteralPath $msi -PathType Leaf)) {
            throw "MSI成果物がありません: $msi"
          }
          $releaseMsi = Join-Path $env:GITHUB_WORKSPACE (Split-Path -Leaf $msi)
          Copy-Item -LiteralPath $msi -Destination $releaseMsi -Force
          $hash = (Get-FileHash -LiteralPath $releaseMsi -Algorithm SHA256).
            Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $releaseMsi)" |
            Out-File -LiteralPath "$releaseMsi.sha256" -Encoding ascii

      - name: Build standalone updater MSI
        shell: pwsh
        env:
          UPDATER_VERSION: ${{ steps.updater-version.outputs.updater_version }}
        run: |
          .\packaging\windows\build-standalone-updater.ps1 `
            -PackageType Msi `
            -AppVersion $env:UPDATER_VERSION

      - name: Create standalone updater MSI checksum
        shell: pwsh
        env:
          UPDATER_VERSION: ${{ steps.updater-version.outputs.updater_version }}
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE '.test-work\standalone-updater\output'
          $packages = @(Get-ChildItem -LiteralPath $output -File -Filter '*.msi')
          if ($packages.Count -ne 1) {
            throw "アップデーターMSI成果物は1件である必要があります: $($packages.Count)"
          }
          $assetName = "NicoCache_nl-Updater-$env:UPDATER_VERSION.msi"
          $releaseMsi = Join-Path $env:GITHUB_WORKSPACE $assetName
          Copy-Item -LiteralPath $packages[0].FullName -Destination $releaseMsi -Force
          $hash = (Get-FileHash -LiteralPath $releaseMsi -Algorithm SHA256).
            Hash.ToLowerInvariant()
          "$hash  $assetName" |
            Out-File -LiteralPath "$releaseMsi.sha256" -Encoding ascii

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          if-no-files-found: error
          path: |
            NicoCache_nl-${{ steps.release-tag.outputs.tag }}.zip
            NicoCache_nl.jar
            NicoCache_nl.jar.sha256
            NicoCache_nl-${{ steps.release-tag.outputs.app_version }}.msi
            NicoCache_nl-${{ steps.release-tag.outputs.app_version }}.msi.sha256
            NicoCache_nl-Updater-${{ steps.updater-version.outputs.updater_version }}.msi
            NicoCache_nl-Updater-${{ steps.updater-version.outputs.updater_version }}.msi.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      APP_VERSION: ${{ needs.build.outputs.app_version }}
      UPDATER_VERSION: ${{ needs.build.outputs.updater_version }}

    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release-assets

      - name: Create GitHub release
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            "release-assets/NicoCache_nl-$RELEASE_TAG.zip" \
            "release-assets/NicoCache_nl.jar" \
            "release-assets/NicoCache_nl.jar.sha256" \
            "release-assets/NicoCache_nl-$APP_VERSION.msi" \
            "release-assets/NicoCache_nl-$APP_VERSION.msi.sha256" \
            "release-assets/NicoCache_nl-Updater-$UPDATER_VERSION.msi" \
            "release-assets/NicoCache_nl-Updater-$UPDATER_VERSION.msi.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_TAG"
