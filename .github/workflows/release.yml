name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 既存のリリースタグ
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
      app_version: ${{ steps.release-tag.outputs.app_version }}
      updater_version: ${{ steps.updater-version.outputs.updater_version }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Show release source revision
        shell: pwsh
        run: git show -s --format="commit=%H%ncommitted=%cI%nsubject=%s" HEAD

      - name: Set up JDK 17 for compatibility build
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate release tag
        id: release-tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) {
            throw "リリースタグが指定されていません"
          }
          if ($env:RELEASE_TAG -notmatch '^v(?<major>\d+)\.(?<minor>\d+)\.(?<build>\d+)$') {
            throw "リリースタグは v<major>.<minor>.<build> 形式で指定してください: $env:RELEASE_TAG"
          }
          if ([int]$Matches.major -gt 255 -or
              [int]$Matches.minor -gt 255 -or
              [int]$Matches.build -gt 65535) {
            throw "MSIで利用できる版の範囲を超えています: $env:RELEASE_TAG"
          }
          "tag=$env:RELEASE_TAG" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "app_version=$($env:RELEASE_TAG.Substring(1))" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Validate standalone updater version
        id: updater-version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw -LiteralPath .\updater\VERSION).Trim()
          if ($version -notmatch '^(?<major>\d+)\.(?<minor>\d+)\.(?<build>\d+)$') {
            throw "アップデーター版は <major>.<minor>.<build> 形式で指定してください: $version"
          }
          if ([int]$Matches.major -gt 255 -or
              [int]$Matches.minor -gt 255 -or
              [int]$Matches.build -gt 65535) {
            throw "MSIで利用できるアップデーター版の範囲を超えています: $version"
          }
          "updater_version=$version" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build NicoCache Java applications
        shell: pwsh
        run: .\build-javac.ps1 -JavaVersion 17

      - name: Run functional and Extension ABI tests
        shell: pwsh
        run: .\test-functional.ps1 -KeepWorkDir

      - name: Upload functional test diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: functional-test-diagnostics
          if-no-files-found: ignore
          include-hidden-files: true
          path: .test-work/functional

      - name: Set up JDK 25 for Windows installer
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Show Windows packaging tool versions
        shell: pwsh
        run: |
          java --version
          jpackage --version
          Get-Command candle, light | Select-Object Name, Source

      - name: Test Windows setup script
        shell: pwsh
        run: .\packaging\windows\test-windows-setup-script.ps1

      - name: Build release app image and MSI
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.release-tag.outputs.app_version }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          .\packaging\windows\build-windows-package.ps1 `
            -PackageType All `
            -AppVersion $env:APP_VERSION `
            -ZipFileName "NicoCache_nl-$env:RELEASE_TAG.zip"

      - name: Stage distribution archive
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE `
            ".test-work\windows-package\output\NicoCache_nl-$env:RELEASE_TAG.zip"
          $destination = Join-Path $env:GITHUB_WORKSPACE `
            "NicoCache_nl-$env:RELEASE_TAG.zip"
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "共通アプリイメージから作成したZIPがありません: $source"
          }
          Copy-Item -LiteralPath $source -Destination $destination -Force

      - name: Test release MSI structure
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.release-tag.outputs.app_version }}
        run: |
          .\packaging\windows\test-windows-msi-structure.ps1 `
            -MsiPath (
              ".\.test-work\windows-package\output\NicoCache_nl-$env:APP_VERSION.msi"
            )

      - name: Test release app image
        shell: pwsh
        run: |
          .\packaging\windows\test-windows-app-image.ps1 `
            -AppImagePath .\.test-work\windows-package\output\NicoCache_nl

      - name: Test ZIP and app image parity
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          .\packaging\windows\test-package-parity.ps1 `
            -AppImagePath .\.test-work\windows-package\output\NicoCache_nl `
            -ZipPath ".\.test-work\windows-package\output\NicoCache_nl-$env:RELEASE_TAG.zip"

      - name: Test release Windows integration and rollback
        shell: pwsh
        run: |
          .\packaging\windows\test-windows-first-run.ps1 `
            -AppImagePath .\.test-work\windows-package\output\NicoCache_nl

      - name: Create MSI checksum
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.release-tag.outputs.app_version }}
        run: |
          $msi = Join-Path $env:GITHUB_WORKSPACE (
            ".test-work\windows-package\output\NicoCache_nl-$env:APP_VERSION.msi"
          )
          if (-not (Test-Path -LiteralPath $msi -PathType Leaf)) {
            throw "MSI成果物がありません: $msi"
          }
          $releaseMsi = Join-Path $env:GITHUB_WORKSPACE (Split-Path -Leaf $msi)
          Copy-Item -LiteralPath $msi -Destination $releaseMsi -Force
          $hash = (Get-FileHash -LiteralPath $releaseMsi -Algorithm SHA256).
            Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $releaseMsi)" |
            Out-File -LiteralPath "$releaseMsi.sha256" -Encoding ascii

      - name: Build standalone updater MSI
        shell: pwsh
        env:
          UPDATER_VERSION: ${{ steps.updater-version.outputs.updater_version }}
        run: |
          .\packaging\windows\build-standalone-updater.ps1 `
            -PackageType Msi `
            -AppVersion $env:UPDATER_VERSION

      - name: Create standalone updater MSI checksum
        shell: pwsh
        env:
          UPDATER_VERSION: ${{ steps.updater-version.outputs.updater_version }}
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE '.test-work\standalone-updater\output'
          $packages = @(Get-ChildItem -LiteralPath $output -File -Filter '*.msi')
          if ($packages.Count -ne 1) {
            throw "アップデーターMSI成果物は1件である必要があります: $($packages.Count)"
          }
          $assetName = "NicoCache_nl-Updater-$env:UPDATER_VERSION.msi"
          $releaseMsi = Join-Path $env:GITHUB_WORKSPACE $assetName
          Copy-Item -LiteralPath $packages[0].FullName -Destination $releaseMsi -Force
          $hash = (Get-FileHash -LiteralPath $releaseMsi -Algorithm SHA256).
            Hash.ToLowerInvariant()
          "$hash  $assetName" |
            Out-File -LiteralPath "$releaseMsi.sha256" -Encoding ascii

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          if-no-files-found: error
          path: |
            NicoCache_nl-${{ steps.release-tag.outputs.tag }}.zip
            NicoCache_nl-${{ steps.release-tag.outputs.app_version }}.msi
            NicoCache_nl-${{ steps.release-tag.outputs.app_version }}.msi.sha256
            NicoCache_nl-Updater-${{ steps.updater-version.outputs.updater_version }}.msi
            NicoCache_nl-Updater-${{ steps.updater-version.outputs.updater_version }}.msi.sha256

  build-unix:
    needs: build
    name: Build ${{ matrix.platform }} release assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-24.04
          - platform: MacOS
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      APP_VERSION: ${{ needs.build.outputs.app_version }}
      UPDATER_VERSION: ${{ needs.build.outputs.updater_version }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.tag }}

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Linux package inspection tools
        if: matrix.platform == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm

      - name: Build and test Unix application packages
        shell: pwsh
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          ./packaging/unix/build-package.ps1 `
            -Platform $env:TARGET_PLATFORM `
            -PackageType All `
            -AppVersion $env:APP_VERSION
          ./packaging/unix/test-package.ps1 `
            -Platform $env:TARGET_PLATFORM `
            -AppVersion $env:APP_VERSION

      - name: Build and test Unix standalone updater packages
        shell: pwsh
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          ./packaging/unix/build-standalone-updater.ps1 `
            -Platform $env:TARGET_PLATFORM `
            -PackageType All `
            -AppVersion $env:UPDATER_VERSION
          ./packaging/unix/test-standalone-updater.ps1 `
            -Platform $env:TARGET_PLATFORM `
            -AppVersion $env:UPDATER_VERSION

      - name: Stage Unix release assets and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $architecture = switch ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()) {
            'X64' { 'x64' }
            'Arm64' { 'arm64' }
            'X86' { 'x86' }
            default { throw '未対応のCPUアーキテクチャです' }
          }
          $platformId = '${{ matrix.platform }}'.ToLowerInvariant()
          $appOutput = Join-Path $env:GITHUB_WORKSPACE ('.test-work/unix-package-' + $platformId + '/output')
          $updaterOutput = Join-Path $env:GITHUB_WORKSPACE ('.test-work/standalone-updater-' + $platformId + '/output')
          $releaseAssets = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          New-Item -ItemType Directory -Path $releaseAssets -Force | Out-Null
          $patterns = @(
            "NicoCache_nl-$env:APP_VERSION-$platformId-$architecture.zip",
            "NicoCache_nl-$env:APP_VERSION-$platformId-$architecture.deb",
            "NicoCache_nl-$env:APP_VERSION-$platformId-$architecture.rpm",
            "NicoCache_nl-$env:APP_VERSION-$platformId-$architecture.pkg",
            "NicoCache_nl-$env:APP_VERSION-$platformId-$architecture.dmg"
          )
          $updaterPatterns = @(
            "NicoCache_nl-Updater-$env:UPDATER_VERSION-$platformId-$architecture.zip",
            "NicoCache_nl-Updater-$env:UPDATER_VERSION-$platformId-$architecture.deb",
            "NicoCache_nl-Updater-$env:UPDATER_VERSION-$platformId-$architecture.rpm",
            "NicoCache_nl-Updater-$env:UPDATER_VERSION-$platformId-$architecture.pkg",
            "NicoCache_nl-Updater-$env:UPDATER_VERSION-$platformId-$architecture.dmg"
          )
          foreach ($pattern in $patterns) {
            $candidate = Get-ChildItem -LiteralPath $appOutput -File -Filter $pattern -ErrorAction SilentlyContinue
            if ($candidate) { Copy-Item -LiteralPath $candidate.FullName -Destination $releaseAssets -Force }
          }
          foreach ($pattern in $updaterPatterns) {
            $candidate = Get-ChildItem -LiteralPath $updaterOutput -File -Filter $pattern -ErrorAction SilentlyContinue
            if ($candidate) { Copy-Item -LiteralPath $candidate.FullName -Destination $releaseAssets -Force }
          }
          $assets = @(Get-ChildItem -LiteralPath $releaseAssets -File)
          if ($assets.Count -lt 6) { throw "Unixリリース資産が不足しています: $($assets.Count)" }
          foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($asset.Name)" | Out-File -LiteralPath ($asset.FullName + '.sha256') -Encoding ascii
          }

      - name: Upload Unix release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ matrix.platform }}
          if-no-files-found: error
          path: release-assets/*

  publish:
    needs: [build, build-unix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}

    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-assets*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        shell: bash
        run: |
          test -n "$(find release-assets -maxdepth 1 -type f | head -n 1)"
          gh release create "$RELEASE_TAG" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_TAG"
