name: Windows Installer Prototype

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/installer-prototype.yml'
      - 'packaging/windows/**'
      - 'src/**'
      - 'defaults/**'
      - 'extensions/**'
      - 'local/**'
      - 'manifest-nl.mf'
      - 'certificate-targets.txt'
      - 'config.properties.default'
      - 'NicoCacheGUI_native*.dll'
      - 'niconico-0.ico'
      - 'nlFilter_sys.txt'
      - 'proxy_sample.pac'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/installer-prototype.yml'
      - 'packaging/windows/**'
      - 'src/**'
      - 'defaults/**'
      - 'extensions/**'
      - 'local/**'
      - 'manifest-nl.mf'
      - 'certificate-targets.txt'
      - 'config.properties.default'
      - 'NicoCacheGUI_native*.dll'
      - 'niconico-0.ico'
      - 'nlFilter_sys.txt'
      - 'proxy_sample.pac'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-prototype-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-and-test:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out nlFilters 01-20 source files
        uses: actions/checkout@v4
        with:
          repository: roflsunriz/nlFilters
          ref: main
          path: nlFilters
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show packaging tool versions
        shell: pwsh
        run: |
          java --version
          jpackage --version
          Get-Command candle, light | Select-Object Name, Source

      - name: Test Windows setup failure diagnostics
        shell: pwsh
        run: .\packaging\windows\test-windows-setup-script.ps1

      - name: Build previous MSI
        shell: pwsh
        run: |
          .\packaging\windows\build-windows-package.ps1 `
            -PackageType All `
            -AppVersion 0.1.5 `
            -NlFiltersSource .\nlFilters
          $lifecycle = New-Item `
            -ItemType Directory `
            -Path .\.test-work\installer-lifecycle `
            -Force
          $previousMsi = Get-ChildItem `
            -LiteralPath .\.test-work\windows-package\output `
            -File `
            -Filter '*.msi' |
            Select-Object -First 1
          if (-not $previousMsi) {
            throw '旧版MSI成果物がありません'
          }
          Copy-Item -LiteralPath $previousMsi.FullName `
            -Destination (Join-Path $lifecycle 'NicoCache_nl-0.1.5.msi')

      - name: Build current app image and MSI
        shell: pwsh
        run: |
          .\packaging\windows\build-windows-package.ps1 `
            -PackageType All `
            -AppVersion 0.1.6 `
            -NlFiltersSource .\nlFilters

      - name: Test MSI shortcut structure
        shell: pwsh
        run: |
          $msi = Get-ChildItem `
            -LiteralPath .\.test-work\windows-package\output `
            -File `
            -Filter '*.msi' |
            Select-Object -First 1
          if (-not $msi) {
            throw '新版MSI成果物がありません'
          }
          .\packaging\windows\test-windows-msi-structure.ps1 `
            -MsiPath $msi.FullName

      - name: Test isolated app image
        shell: pwsh
        run: |
          .\packaging\windows\test-windows-app-image.ps1 `
            -AppImagePath .\.test-work\windows-package\output\NicoCache_nl

      - name: Test first-run Windows integration and rollback
        shell: pwsh
        run: |
          .\packaging\windows\test-windows-first-run.ps1 `
            -AppImagePath .\.test-work\windows-package\output\NicoCache_nl

      - name: Test MSI install repair upgrade and uninstall
        shell: pwsh
        run: |
          $msi = Get-ChildItem `
            -LiteralPath .\.test-work\windows-package\output `
            -File `
            -Filter '*.msi' |
            Select-Object -First 1
          if (-not $msi) {
            throw '新版MSI成果物がありません'
          }
          .\packaging\windows\test-windows-msi.ps1 `
            -PreviousMsiPath `
              .\.test-work\installer-lifecycle\NicoCache_nl-0.1.5.msi `
            -MsiPath $msi.FullName

      - name: Create MSI checksum
        shell: pwsh
        run: |
          $output = Resolve-Path .\.test-work\windows-package\output
          $msi = Get-ChildItem -LiteralPath $output -File -Filter '*.msi' |
            Select-Object -First 1
          $hash = (Get-FileHash -LiteralPath $msi.FullName -Algorithm SHA256).
            Hash.ToLowerInvariant()
          "$hash  $($msi.Name)" |
            Out-File -LiteralPath "$($msi.FullName).sha256" -Encoding ascii

      - name: Upload prototype installer
        uses: actions/upload-artifact@v4
        with:
          name: nicocache-windows-installer-prototype
          if-no-files-found: error
          path: |
            .test-work/windows-package/output/*.msi
            .test-work/windows-package/output/*.msi.sha256
