name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 11
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '11'

      - name: Show tool versions
        shell: pwsh
        run: |
          java --version
          javac --version
          jar --version

      - name: Verify repository dependency lock
        shell: pwsh
        run: |
          .\packaging\windows\test-dependency-lock.ps1
          .\packaging\windows\test-dependency-update.ps1

      - name: Build NicoCache_nl.jar
        shell: pwsh
        run: .\build-javac.ps1

      - name: Run functional and Extension ABI tests
        shell: pwsh
        run: .\test-functional.ps1

      - name: Run first-run setup tests
        shell: pwsh
        run: .\test-first-run-setup.ps1

      - name: Run strict end-to-end and GUI tests
        timeout-minutes: 5
        shell: pwsh
        run: .\test-e2e.ps1

      - name: Run safe Windows setup script failure test
        shell: pwsh
        run: .\packaging\windows\test-windows-setup-script.ps1

      - name: Run release workflow contract tests
        shell: pwsh
        run: .\tests\release\test-release-workflow.ps1

      - name: Check the working tree
        shell: pwsh
        run: |
          git diff --check
          $changes = @(git status --short)
          if ($changes.Count -gt 0) {
            $changes | Write-Output
            throw "ビルドまたはテストによって追跡対象の差分が発生しました"
          }

  java-25-compatibility:
    name: Java 25 compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Show Java 25 tool versions
        shell: pwsh
        run: |
          java --version
          javac --version
          jar --version

      - name: Build and test with Java 25
        shell: pwsh
        run: |
          ./build-javac.ps1
          ./test-functional.ps1
          ./test-first-run-setup.ps1

      - name: Run strict end-to-end and GUI tests with Java 25
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: ./test-e2e.ps1
