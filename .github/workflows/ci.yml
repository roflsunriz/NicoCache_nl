name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 11
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '11'

      - name: Show tool versions
        shell: pwsh
        run: |
          java --version
          javac --version
          jar --version

      - name: Verify repository dependency lock
        shell: pwsh
        run: |
          .\packaging\windows\test-dependency-lock.ps1
          .\packaging\windows\test-dependency-update.ps1

      - name: Build NicoCache_nl.jar
        shell: pwsh
        run: .\build-javac.ps1

      - name: Run functional and Extension ABI tests
        shell: pwsh
        run: .\test-functional.ps1

      - name: Run first-run setup tests
        shell: pwsh
        run: .\test-first-run-setup.ps1

      - name: Run safe Windows setup script failure test
        shell: pwsh
        run: .\packaging\windows\test-windows-setup-script.ps1

      - name: Run release workflow contract tests
        shell: pwsh
        run: .\tests\release\test-release-workflow.ps1

      - name: Check the working tree
        shell: pwsh
        run: |
          git diff --check
          $changes = @(git status --short)
          if ($changes.Count -gt 0) {
            $changes | Write-Output
            throw "ビルドまたはテストによって追跡対象の差分が発生しました"
          }
