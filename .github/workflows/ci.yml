name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up default Temurin 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version-file: '.java-version'

      - name: Show tool versions
        shell: pwsh
        run: |
          java --version
          javac --version
          jar --version

      - name: Run Java tool selection tests
        shell: pwsh
        run: .\tests\release\test-java-tool-selection.ps1

      - name: Verify repository dependency lock
        shell: pwsh
        run: |
          .\packaging\windows\test-dependency-lock.ps1
          .\packaging\windows\test-dependency-update.ps1

      - name: Prepare Bouncy Castle build dependencies
        shell: pwsh
        run: .\packaging\windows\prepare-dependencies.ps1 -DestinationDirectory .\.test-work\ci-dependencies

      - name: Build NicoCache Java applications
        shell: pwsh
        run: .\build-javac.ps1 -LibraryDirectory .\.test-work\ci-dependencies -Clean

      - name: Run local browser script tests
        shell: pwsh
        run: node --test .\tests\local\*.test.js

      - name: Run functional and Extension ABI tests
        shell: pwsh
        run: .\test-functional.ps1 -LibraryDirectory .\.test-work\ci-dependencies

      - name: Run core API contract tests
        shell: pwsh
        run: .\test-api.ps1 -LibraryDirectory .\.test-work\ci-dependencies

      - name: Run first-run setup tests
        shell: pwsh
        run: .\test-first-run-setup.ps1 -LibraryDirectory .\.test-work\ci-dependencies

      - name: Run CMAF/Domand converter tests
        shell: pwsh
        run: .\tools\cmaf-to-mp4\test.ps1

      - name: Run cross-platform launcher contract tests
        shell: pwsh
        run: .\test-launcher.ps1

      - name: Run diagnostics watchdog tests
        shell: pwsh
        run: .\test-diagnostics.ps1

      - name: Run strict end-to-end and GUI tests
        timeout-minutes: 5
        shell: pwsh
        run: .\test-e2e.ps1 -LibraryDirectory .\.test-work\ci-dependencies

      - name: Run Windows task scheduler integration test
        shell: pwsh
        run: .\packaging\windows\test-windows-task-scheduler.ps1

      - name: Run safe Windows setup script failure test
        shell: pwsh
        run: .\packaging\windows\test-windows-setup-script.ps1

      - name: Run release workflow contract tests
        shell: pwsh
        run: .\tests\release\test-release-workflow.ps1

      - name: Run GitHub community file contract tests
        shell: pwsh
        run: .\tests\release\test-github-community-files.ps1

      - name: Prepare cross-vendor runtime compatibility tests
        shell: pwsh
        run: .\test-runtime-compatibility.ps1 -Mode Prepare -LibraryDirectory .\.test-work\ci-dependencies

      - name: Upload runtime compatibility test artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-compatibility-tests
          path: .test-work/runtime-compatibility/artifact
          if-no-files-found: error
          include-hidden-files: true

      - name: Check the working tree
        shell: pwsh
        run: |
          git diff --check
          $changes = @(git status --short)
          if ($changes.Count -gt 0) {
            $changes | Write-Output
            throw "ビルドまたはテストによって追跡対象の差分が発生しました"
          }

  default-temurin-25:
    name: Default Temurin 25 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up default Temurin 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version-file: '.java-version'

      - name: Show Java 25 tool versions
        shell: pwsh
        run: |
          java --version
          javac --version
          jar --version

      - name: Prepare Bouncy Castle build dependencies
        shell: pwsh
        run: .\packaging\windows\prepare-dependencies.ps1 -DestinationDirectory .\.test-work\ci-dependencies

      - name: Build and test with Java 25
        shell: pwsh
        run: |
          ./build-javac.ps1 -LibraryDirectory ./.test-work/ci-dependencies -Clean
          ./test-functional.ps1 -LibraryDirectory ./.test-work/ci-dependencies
          ./test-first-run-setup.ps1 -LibraryDirectory ./.test-work/ci-dependencies
          ./test-launcher.ps1
          ./test-diagnostics.ps1

      - name: Run strict end-to-end and GUI tests with Java 25
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: ./test-e2e.ps1 -LibraryDirectory ./.test-work/ci-dependencies

      - name: Run Windows task scheduler integration test with Java 25
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/test-windows-task-scheduler.ps1

  java-17-compatibility:
    name: Explicit Temurin 17 compatibility
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up explicit Temurin 17 compatibility JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Bouncy Castle build dependencies
        shell: pwsh
        run: .\packaging\windows\prepare-dependencies.ps1 -DestinationDirectory .\.test-work\java-17-dependencies

      - name: Build and test with explicit Temurin 17
        shell: pwsh
        run: |
          .\build-javac.ps1 -JavaVersion 17 -LibraryDirectory .\.test-work\java-17-dependencies -Clean
          .\test-functional.ps1 -LibraryDirectory .\.test-work\java-17-dependencies
          .\test-launcher.ps1
          .\test-diagnostics.ps1

  runtime-compatibility:
    name: Runtime ${{ matrix.distribution }} Java ${{ matrix.major }}
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 13
      matrix:
        include:
          - { distribution: temurin, java-version: '17', major: 17 }
          - { distribution: temurin, java-version: '21', major: 21 }
          - { distribution: temurin, java-version: '25', major: 25 }
          - { distribution: zulu, java-version: '17', major: 17 }
          - { distribution: zulu, java-version: '21', major: 21 }
          - { distribution: zulu, java-version: '25', major: 25 }
          - { distribution: liberica, java-version: '17', major: 17 }
          - { distribution: liberica, java-version: '21', major: 21 }
          - { distribution: liberica, java-version: '25', major: 25 }
          - { distribution: microsoft, java-version: '17', major: 17 }
          - { distribution: microsoft, java-version: '21', major: 21 }
          - { distribution: microsoft, java-version: '25', major: 25 }
          - { distribution: semeru, java-version: '17', major: 17 }
          - { distribution: semeru, java-version: '21', major: 21 }
          - { distribution: semeru, java-version: '25', major: 25 }
          - { distribution: corretto, java-version: '17', major: 17 }
          - { distribution: corretto, java-version: '21', major: 21 }
          - { distribution: corretto, java-version: '25', major: 25 }
          - { distribution: oracle, java-version: '17.0.12', major: 17 }
          - { distribution: oracle, java-version: '21', major: 21 }
          - { distribution: oracle, java-version: '25', major: 25 }
          - { distribution: dragonwell, java-version: '17', major: 17 }
          - { distribution: dragonwell, java-version: '21', major: 21 }
          - { distribution: dragonwell, java-version: '25', major: 25 }
          - { distribution: sapmachine, java-version: '17', major: 17 }
          - { distribution: sapmachine, java-version: '21', major: 21 }
          - { distribution: sapmachine, java-version: '25', major: 25 }
          - { distribution: graalvm, java-version: '17.0.12', major: 17 }
          - { distribution: graalvm, java-version: '21', major: 21 }
          - { distribution: graalvm, java-version: '25', major: 25 }
          - { distribution: graalvm-community, java-version: '17', major: 17 }
          - { distribution: graalvm-community, java-version: '21', major: 21 }
          - { distribution: graalvm-community, java-version: '25', major: 25 }
          - { distribution: jetbrains, java-version: '17', major: 17 }
          - { distribution: jetbrains, java-version: '21', major: 21 }
          - { distribution: jetbrains, java-version: '25', major: 25 }
          - { distribution: kona, java-version: '17', major: 17 }
          - { distribution: kona, java-version: '21', major: 21 }
          - { distribution: kona, java-version: '25', major: 25 }

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download runtime compatibility test artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-compatibility-tests
          path: .test-work/runtime-compatibility/artifact

      - name: Set up target JDK
        id: setup-target-jdk
        continue-on-error: true
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java-version }}

      - name: Retry target JDK setup after a transient provider failure
        if: steps.setup-target-jdk.outcome == 'failure'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java-version }}

      - name: Run runtime compatibility tests
        shell: pwsh
        run: >-
          ./test-runtime-compatibility.ps1
          -Mode Run
          -ExpectedMajor ${{ matrix.major }}
          -RunId '${{ matrix.distribution }}-${{ matrix.major }}'

  runtime-compatibility-gate:
    name: runtime-compatibility-gate
    if: ${{ always() }}
    needs: runtime-compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Require every runtime compatibility job
        shell: bash
        env:
          RUNTIME_RESULT: ${{ needs.runtime-compatibility.result }}
        run: |
          if [ "$RUNTIME_RESULT" != 'success' ]; then
            echo "Runtime compatibility matrix result: $RUNTIME_RESULT" >&2
            exit 1
          fi
