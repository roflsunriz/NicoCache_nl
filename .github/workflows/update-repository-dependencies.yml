name: Update repository dependencies

on:
  schedule:
    - cron: '17 18 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-repository-dependencies
  cancel-in-progress: false

jobs:
  update-bouncy-castle:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Resolve and verify latest Bouncy Castle release
        id: update
        shell: pwsh
        run: |
          .\packaging\windows\update-dependency-lock.ps1 `
            -Mode Update `
            -ReportFile "$env:RUNNER_TEMP\dependency-update-report.md"
          .\packaging\windows\test-dependency-lock.ps1

      - name: Set up default Temurin 25
        if: steps.update.outputs.updated == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version-file: '.java-version'

      - name: Prepare Bouncy Castle build dependencies
        if: steps.update.outputs.updated == 'true'
        shell: pwsh
        run: .\packaging\windows\prepare-dependencies.ps1 -DestinationDirectory .\.test-work\dependency-build

      - name: Run Java build and functional tests
        if: steps.update.outputs.updated == 'true'
        shell: pwsh
        run: |
          .\build-javac.ps1 -LibraryDirectory .\.test-work\dependency-build -Clean
          .\test-functional.ps1 -LibraryDirectory .\.test-work\dependency-build
          .\test-first-run-setup.ps1 -LibraryDirectory .\.test-work\dependency-build
          .\packaging\windows\test-windows-setup-script.ps1

      - name: Set up default Temurin 25 for packaging
        if: steps.update.outputs.updated == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version-file: '.java-version'

      - name: Build and test Windows package
        if: steps.update.outputs.updated == 'true'
        shell: pwsh
        run: |
          .\packaging\windows\build-windows-package.ps1 `
            -PackageType All `
            -AppVersion 1.0.0
          .\packaging\windows\test-windows-app-image.ps1 `
            -AppImagePath .\.test-work\windows-package\output\NicoCache_nl
          $msi = Get-ChildItem `
            -LiteralPath .\.test-work\windows-package\output `
            -File -Filter '*.msi' | Select-Object -First 1
          if (-not $msi) {
            throw 'MSI成果物がありません'
          }
          .\packaging\windows\test-windows-msi-structure.ps1 `
            -MsiPath $msi.FullName

      - name: Create or update dependency pull request
        if: steps.update.outputs.updated == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.update.outputs.new-version }}
        run: |
          $branch = 'automation/update-bouncy-castle'
          $title = "build(deps): Bouncy Castleを$env:NEW_VERSIONへ更新"
          $report = "$env:RUNNER_TEMP\dependency-update-report.md"
          $additionalReport = @(
            ''
            '## 自動検証'
            ''
            '- dependency-lock.psd1のURL・版・ファイル名整合性'
            '- 公式Maven Centralから取得した実体のSHA-256'
            '- POMのライセンス名と公式ライセンスURL'
            '- 既定のTemurin 25によるコンパイルと機能テスト'
            '- Windowsアプリケーションルート・ZIP・MSI生成'
            '- アプリケーションルートのスモークテストとMSI構造テスト'
            ''
            '自動マージは行いません。レビュー後に取り込んでください。'
          )
          Add-Content -LiteralPath $report -Value $additionalReport -Encoding utf8

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin --prune
          git switch -C $branch
          $changedLock = @(git diff --name-only -- packaging/windows/dependency-lock.psd1)
          if ($changedLock.Count -ne 1 -or
              $changedLock[0] -ne 'packaging/windows/dependency-lock.psd1') {
            throw '依存ロック更新後の差分が想定と一致しません'
          }
          git diff --check
          git add packaging/windows/dependency-lock.psd1
          git diff --cached --check
          git commit -m $title
          if ($LASTEXITCODE -ne 0) { throw '依存更新コミットに失敗しました' }
          git push --force-with-lease origin "HEAD:refs/heads/$branch"
          if ($LASTEXITCODE -ne 0) { throw '依存更新ブランチのpushに失敗しました' }

          $existing = @(gh pr list `
            --head $branch `
            --base main `
            --state open `
            --json number `
            --jq '.[0].number')
          if ($LASTEXITCODE -ne 0) { throw '依存更新PRの検索に失敗しました' }
          if ($existing.Count -gt 0) {
            gh pr edit $existing[0] --title $title --body-file $report
            if ($LASTEXITCODE -ne 0) { throw '依存更新PRの更新に失敗しました' }
          }
          else {
            gh pr create `
              --base main `
              --head $branch `
              --title $title `
              --body-file $report
            if ($LASTEXITCODE -ne 0) { throw '依存更新PRの作成に失敗しました' }
          }

      - name: Report no update
        if: steps.update.outputs.updated != 'true'
        shell: pwsh
        run: Write-Output 'Bouncy Castleは最新です。PRは作成しません。'
