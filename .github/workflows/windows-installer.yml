name: Windows Installer

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/windows-installer.yml'
      - 'packaging/windows/**'
      - 'src/**'
      - 'defaults/**'
      - 'extensions/**'
      - 'local/**'
      - 'manifest-nl.mf'
      - 'certificate-targets.txt'
      - 'config.properties.default'
      - 'NicoCacheGUI_native*.dll'
      - 'niconico-0.ico'
      - 'nlFilter_sys.txt'
      - 'proxy_sample.pac'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/windows-installer.yml'
      - 'packaging/windows/**'
      - 'src/**'
      - 'defaults/**'
      - 'extensions/**'
      - 'local/**'
      - 'manifest-nl.mf'
      - 'certificate-targets.txt'
      - 'config.properties.default'
      - 'NicoCacheGUI_native*.dll'
      - 'niconico-0.ico'
      - 'nlFilter_sys.txt'
      - 'proxy_sample.pac'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-and-test:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      TEST_PREVIOUS_VERSION: 1.0.0
      TEST_CURRENT_VERSION: 1.0.1

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Show packaging source revision
        shell: pwsh
        run: git show -s --format="commit=%H%ncommitted=%cI%nsubject=%s" HEAD

      - name: Check out nlFilters 01-20 source files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: roflsunriz/nlFilters
          ref: main
          path: nlFilters
          persist-credentials: false

      - name: Show nlFilters source revision
        shell: pwsh
        run: git -C nlFilters show -s --format="commit=%H%ncommitted=%cI%nsubject=%s" HEAD

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Show packaging tool versions
        shell: pwsh
        run: |
          java --version
          jpackage --version
          Get-Command candle, light | Select-Object Name, Source

      - name: Test Windows setup failure diagnostics
        shell: pwsh
        run: .\packaging\windows\test-windows-setup-script.ps1

      - name: Build previous MSI
        shell: pwsh
        run: |
          .\packaging\windows\build-windows-package.ps1 `
            -PackageType All `
            -AppVersion $env:TEST_PREVIOUS_VERSION `
            -NlFiltersSource .\nlFilters
          $lifecycle = New-Item `
            -ItemType Directory `
            -Path .\.test-work\installer-lifecycle `
            -Force
          $previousMsi = Get-ChildItem `
            -LiteralPath .\.test-work\windows-package\output `
            -File `
            -Filter '*.msi' |
            Select-Object -First 1
          if (-not $previousMsi) {
            throw '旧版MSI成果物がありません'
          }
          Copy-Item -LiteralPath $previousMsi.FullName `
            -Destination (
              Join-Path $lifecycle (
                "NicoCache_nl-$env:TEST_PREVIOUS_VERSION.msi"
              )
            )

      - name: Build current app image and MSI
        shell: pwsh
        run: |
          .\packaging\windows\build-windows-package.ps1 `
            -PackageType All `
            -AppVersion $env:TEST_CURRENT_VERSION `
            -NlFiltersSource .\nlFilters

      - name: Test MSI shortcut structure
        shell: pwsh
        run: |
          $msi = Get-ChildItem `
            -LiteralPath .\.test-work\windows-package\output `
            -File `
            -Filter '*.msi' |
            Select-Object -First 1
          if (-not $msi) {
            throw '新版MSI成果物がありません'
          }
          .\packaging\windows\test-windows-msi-structure.ps1 `
            -MsiPath $msi.FullName

      - name: Test isolated app image
        shell: pwsh
        run: |
          .\packaging\windows\test-windows-app-image.ps1 `
            -AppImagePath .\.test-work\windows-package\output\NicoCache_nl

      - name: Test first-run Windows integration and rollback
        shell: pwsh
        run: |
          .\packaging\windows\test-windows-first-run.ps1 `
            -AppImagePath .\.test-work\windows-package\output\NicoCache_nl

      - name: Test MSI install repair upgrade and uninstall
        shell: pwsh
        run: |
          $msi = Get-ChildItem `
            -LiteralPath .\.test-work\windows-package\output `
            -File `
            -Filter '*.msi' |
            Select-Object -First 1
          if (-not $msi) {
            throw '新版MSI成果物がありません'
          }
          .\packaging\windows\test-windows-msi.ps1 `
            -PreviousMsiPath `
            ".\.test-work\installer-lifecycle\NicoCache_nl-$env:TEST_PREVIOUS_VERSION.msi" `
            -MsiPath $msi.FullName `
            -ExpectedPreviousVersion $env:TEST_PREVIOUS_VERSION `
            -ExpectedCurrentVersion $env:TEST_CURRENT_VERSION

      - name: Upload MSI lifecycle diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: msi-lifecycle-diagnostics
          if-no-files-found: ignore
          include-hidden-files: true
          path: .test-work/msi-*.log

      - name: Create MSI checksum
        shell: pwsh
        run: |
          $output = Resolve-Path .\.test-work\windows-package\output
          $msi = Get-ChildItem -LiteralPath $output -File -Filter '*.msi' |
            Select-Object -First 1
          $hash = (Get-FileHash -LiteralPath $msi.FullName -Algorithm SHA256).
            Hash.ToLowerInvariant()
          "$hash  $($msi.Name)" |
            Out-File -LiteralPath "$($msi.FullName).sha256" -Encoding ascii

      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nicocache-windows-installer
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .test-work/windows-package/output/*.msi
            .test-work/windows-package/output/*.msi.sha256
