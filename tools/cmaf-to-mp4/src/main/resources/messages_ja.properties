app.name=NicoCache CMAF/Domand MP4変換
version=バージョン {0}
usage.header=使い方:
usage.command=java -jar nico-cmaf-to-mp4.jar [オプション]
usage.options=オプション:
usage.input=  -i, --input <パス>       キャッシュディレクトリまたはmaster.m3u8（必須）
usage.output=  -o, --output <パス>     出力MP4（省略時はキャッシュの隣）
usage.ffmpeg=      --ffmpeg <パス>     FFmpeg実行ファイル（既定: ffmpeg または FFMPEG_BINARY）
usage.force=  -f, --force              既存の出力ファイルを置き換える
usage.headless=  -H, --headless         GUIを開かずに実行する
usage.title=      --title <文字列>     MP4のtitleメタデータを設定する
usage.lang=      --lang <ja|en>        表示言語を選択する
usage.verbose=      --verbose          実行したFFmpegコマンドを表示する
usage.open-output=      --open-output      変換後に出力先フォルダを開く
usage.help=  -h, --help               このヘルプを表示する
usage.version=  -v, --version          バージョンを表示する
