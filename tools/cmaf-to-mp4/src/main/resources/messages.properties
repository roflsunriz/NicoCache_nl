app.name=NicoCache CMAF/Domand MP4 Converter
version=Version {0}
usage.header=Usage:
usage.command=java -jar nico-cmaf-to-mp4.jar [options]
usage.options=Options:
usage.input=  -i, --input <path>       cache directory or master.m3u8 (required)
usage.output=  -o, --output <path>     output MP4 (default: next to the cache)
usage.ffmpeg=      --ffmpeg <path>     FFmpeg executable (default: ffmpeg or FFMPEG_BINARY)
usage.force=  -f, --force              replace an existing output file
usage.headless=  -H, --headless         run without opening the GUI
usage.title=      --title <text>       set the MP4 title metadata
usage.lang=      --lang <ja|en>        select user-facing language
usage.verbose=      --verbose          show the executed FFmpeg command
usage.open-output=      --open-output      open the output folder after conversion
usage.help=  -h, --help               show this help
usage.version=  -v, --version          show the version
