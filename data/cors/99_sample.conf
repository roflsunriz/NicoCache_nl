// CORS設定ファイル(文字コード判定用なのでこの行は削除しないこと)
/* 動作メカニズム
 *   +------------+      1.       +--------------+               +-----------+
 *   |            | ------------> |              | ------------> |           |
 *   |  Browser   |               | NicoCache_nl |               |  Server   |
 *   |            | <------------ |              | <------------ |           |
 *   +------------+      2.       +--------------+               +-----------+
 *
 * 1. リクエストヘッダのOriginがoriginに全体マッチし，かつ，
 *    宛先のURLがurlに全体マッチするときに処理対象とする．
 *    マッチしたリクエストに対して
 *    - Refererヘッダを消去する．
 *    - もしfake-originが設定されていて非nullならば，
 *      リクエストヘッダのOriginをfake-originの値に置き換える．
 *      fake-originの値が"none"の場合はOriginヘッダを消去する．
 *    マッチしたリクエストがOPTIONSの場合は，プリフライトリクエストとして
 *    即座にプリフライトリクエストのレスポンスを生成する．
 *
 * 2. 1でマッチしたリクエストのレスポンスに対して
 *    - 常に
 *        Access-Control-Allow-Origin: (リクエストヘッダのOrigin)
 *      を設定する．
 *    - allow-credentialsがtrueなら同時に
 *        Access-Control-Allow-Credentials: true
 *      も設定する．falseか指定されていないなら削除する．
 *    プリフライトリクエストの場合には
 *    - allow-methodsが設定されている場合は
 *        Access-Control-Allow-Methods: (allow-methodsで与えられたリストにOPTIONSを加えたもの)
 *      を設定する．
 *    - allow-headersが設定されている場合は
 *        Access-Control-Allow-Headers: (allow-headersで与えられたリスト)
 *      を設定する．
 */
[
  // getthumbinfoに外部サイトからアクセス
  {
    "origin": ".*",
    "url": "https?://ext\\.nicovideo\\.jp/api/getthumbinfo/.*",
    "fake-origin": "https://www.nicovideo.jp",
    // getthumbinfoはcredentials無しで利用
    "allow-credentials": false,
    // If-Modified-Sinceをつけたリクエストを許可
    "allow-headers": ["If-Modified-Since"],
  },
  /*
  // example.comとそのサブドメインから拡張hoge以下へのGET,POSTアクセスを許可
  {
    "origin": "https?://(\\w+\\.)?example\\.com",
    "url": "https?://www\\.nicovideo\\.jp/cache/hoge\\?.*",
    // 拡張hogeは要Cookie
    "allow-credentials": true,
    // 拡張hogeがGETとPOSTを受け付ける場合
    "allow-methods": ["GET", "POST"],
  },
  */
]
