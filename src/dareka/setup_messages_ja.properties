window.title=NicoCache_nl 初回セットアップ
step.1=5ステップ中 1: はじめに
step.2=5ステップ中 2: ユーザーデータの保存先
step.3=5ステップ中 3: OS連携を選択
step.4=5ステップ中 4: 確認して適用
step.5=5ステップ中 5: 適用結果
welcome.body=NicoCache_nlを初めて起動するための準備を行います。
welcome.safety=確認画面で「適用」を選ぶまで、証明書、プロキシー、自動起動の設定は変更しません。「キャンセル」するとコンピューターへ変更を加えず終了します。
dataRoot.body=キャッシュ、フィルター、拡張、個人設定など、NicoCache_nlが書き込むユーザーデータをまとめて保存するフォルダーを指定してください。
dataRoot.label=ユーザーデータフォルダー:
dataRoot.dialog=ユーザーデータフォルダーを選択
dataRoot.error.absolute=ルートまたはドライブから始まる絶対パスを指定してください。
dataRoot.error.invalid=使用できないパスです。入力内容を確認してください。
options.body=利用するOS連携を選んでください。4項目とも推奨設定として最初から選択されています。HTTPS MitMとCAはHTTPS通信に必須、proxy.pacは通常通信の性能維持、自動起動は手動起動の手間をなくすための設定です。
option.https=HTTPS MitMを有効にする（HTTPS通信を処理するために必須）
option.ca=ローカルCAをOSの信頼ストアへ登録する（HTTPS通信に必須）
option.proxy=proxy.pacを設定する（通常の通信をプロキシーで遅くしない）
option.autostart=ログオン時の自動起動を登録する（手動起動不要で便利）
summary.body=変更内容を確認してください。選択した項目だけを適用します。
summary.dataRoot=・ユーザーデータの保存先:
summary.https.on=・HTTPS MitMを有効にします（HTTPS通信に必須）。
summary.https.off=・HTTPS MitMを有効にしません（現行ニコニコ動画では不完全な構成になります）。
summary.ca.on=・ローカルCAを生成し、OSの信頼ストアへ登録します（HTTPS通信に必須）。
summary.ca.off=・ローカルCAをOSの信頼ストアへ登録しません（HTTPS通信を検証できません）。
summary.proxy.on=・自動プロキシーURLを http://localhost:8080/proxy.pac に設定します。
summary.proxy.off=・現行ニコニコ動画では不完全な構成になります（proxy.pacが必要です）。
summary.autostart.on=・現在のユーザーのログオン時起動へNicoCache_nlを追加します。
summary.autostart.off=・ログオン時起動へ追加しません。
summary.firefox=Firefoxでは証明書の個別インポートが必要な場合があります。生成場所は certs/ca.cer です。
result.body.success=セットアップが完了しました。各オプションの結果を確認し、「完了」を選んでください。
result.body.failure=セットアップを完了できなかったため、今回の変更をロールバックしました。結果と詳細を確認し、戻って再試行するか「完了」で終了してください。
result.option.https=HTTPS MitM
result.option.ca=ローカルCAの信頼登録
result.option.proxy=自動プロキシー
result.option.autostart=ログオン時自動起動
result.status.success=成功
result.status.failure=失敗（ロールバック済み）
result.status.skipped=未選択
result.error=詳細:
button.back=戻る
button.next=次へ
button.cancel=キャンセル
button.apply=適用
button.finish=完了
button.browse=参照...
status.applying=適用しています...
