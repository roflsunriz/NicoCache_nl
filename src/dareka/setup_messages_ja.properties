window.title=NicoCache_nl 初回セットアップ
step.1=3ステップ中 1: はじめに
step.2=3ステップ中 2: Windows連携を選択
step.3=3ステップ中 3: 確認して適用
welcome.body=NicoCache_nlを初めて起動するための準備を行います。
welcome.safety=最後の画面で「適用」を選ぶまで、証明書、プロキシー、自動起動の設定は変更しません。「キャンセル」するとコンピューターへ変更を加えず終了します。
options.body=利用するWindows連携を選んでください。推奨項目は最初から選択されています。
option.https=HTTPSキャッシュを有効にし、生成した証明書を現在のユーザーで信頼する
option.proxy=WindowsでNicoCache_nlの自動プロキシースクリプトを使用する
option.autostart=このユーザーのログオン時にNicoCache_nlを起動する
summary.body=変更内容を確認してください。選択した項目だけを適用します。
summary.https.on=・ローカルCAを生成し、HTTPSキャッシュを有効にします。
summary.https.off=・HTTPSキャッシュを無効のままにします。
summary.proxy.on=・Windowsの自動プロキシーURLを http://localhost:8080/proxy.pac に設定します。
summary.proxy.off=・Windowsのプロキシー設定を変更しません。
summary.autostart.on=・現在のユーザーのログオン時起動へNicoCache_nlを追加します。
summary.autostart.off=・ログオン時起動へ追加しません。
summary.firefox=Firefoxでは証明書の個別インポートが必要な場合があります。生成場所は certs\\ca.cer です。
button.back=戻る
button.next=次へ
button.cancel=キャンセル
button.apply=適用
status.applying=適用しています...
error.title=セットアップに失敗しました
error.apply=変更を適用できませんでした。今回の変更はロールバックしました。
