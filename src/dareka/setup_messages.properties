welcome.body=This wizard prepares NicoCache_nl for its first launch.
welcome.safety=No certificate, proxy, or auto-start setting is changed until you select Apply on the review screen. Cancel leaves the computer unchanged.
dataRoot.body=Choose one folder for all user data written by NicoCache_nl, including caches, filters, extensions, and personal settings.
dataRoot.label=User data folder:
dataRoot.dialog=Choose user data folder
dataRoot.error.absolute=Enter an absolute path beginning with a drive or root.
dataRoot.error.invalid=This path is invalid. Check the value and try again.
options.body=Choose the OS integration you want. Options required for current Nico video are selected initially.
option.https=Enable HTTPS caching and add the generated certificate to the OS trust store (required for current Nico video)
option.proxy=Use NicoCache_nl through the OS automatic proxy setting (proxy.pac is required for current Nico video)
option.autostart=Start NicoCache_nl when this user signs in
summary.body=Review the changes. Only the selected items will be applied.
summary.dataRoot=• User data location:
summary.https.on=• Generate a local CA and register it in the OS trust store.
summary.https.off=• This is incomplete for current Nico video (HTTPS MitM is required).
summary.proxy.on=• Set the automatic proxy URL to http://localhost:8080/proxy.pac.
summary.proxy.off=• This is incomplete for current Nico video (proxy.pac is required).
summary.autostart.on=• Add NicoCache_nl to the current user's sign-in startup.
summary.autostart.off=• Do not add sign-in startup.
summary.firefox=Firefox may require a separate certificate import. The generated certificate is certs/ca.cer.
result.body.success=Setup completed. Review the result of each option, then select Finish.
result.body.failure=Setup did not complete. Changes from this attempt were rolled back. Review the results and details, then go back to retry or finish to close.
