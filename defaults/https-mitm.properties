# NicoCache_nl HTTPS MitM 設定
#
# 設定を変更した場合は certificate-targets.txt と証明書を同じ対象へ更新してください。

# 現行ニコニコ動画の HTTPS 通信をキャッシュ・書き換え対象にします。
enableMitm=true

# 証明書互換性のため、現行経路に加えて既存証明書の対象も保持しています。
# ホスト部の * はドットに一致しません。ポート省略時は 443 のみが対象です。
mitmHostPort=*.nicovideo.jp *.ce.nicovideo.jp *.sl.nicovideo.jp *.domand.nicovideo.jp:* *.sv.nicovideo.jp *.nicoad.nicovideo.jp *.seiga.nicovideo.jp *.smilevideo.jp *.nimg.jp *.cdn.nimg.jp *.video.nimg.jp *.dmc.nico:* *.nvcomment.nicovideo.jp
