# NicoCache_nl ネットワーク設定
#
# 変更する場合は同じキーを config.properties に記述してください。

# ブラウザーが接続するプロキシーポート。
listenPort=8080

# 起動管理用ローカル API のポート。0 は空きポートを自動選択します。
controlPort=0

# セカンダリプロキシー。proxyHost が空の場合は使用しません。
proxyHost=
proxyPort=8081
proxySSL=false

# 接続元。local、all、lan、lanA、lanB、lanC のいずれかを指定します。
allowFrom=local

# キャッシュ送信速度の上限（Mbps）。0 は無制限、制限時は 8～1000。
speedLimit=0

# ブラウザーおよび上流サーバーとの読み取りタイムアウト（ミリ秒）。
readTimeout=600000

# 本体内でバッファーして処理する POST 本文の最大サイズ（バイト）。
postSizeMax=16777216

# Origin 付き応答へ資格情報付き CORS 許可を追加します。
# 任意サイトへ応答を公開し得るため、必要な場合だけ true にしてください。
alwaysAllowOrigin=false
