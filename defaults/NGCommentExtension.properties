# 値を変更する場合は config.properties に追加してください
# これらの値は swfConvert04 以降であれば動的に変更が反映されます

# NGIDの有効期限 (0なら無期限)
#   NGIDが最後にマッチしてから有効な日数を指定する。
NGCommExpire=30

# 有効期限のチェック間隔 (0なら毎回チェック)
#   NGIDの有効期限をチェックする間隔を秒単位で指定する。
NGCommExpireEvery=3600

# 有効期限チェックを匿名IDに限定 (true/false)
#   この値がtrueなら、有効期限チェックを匿名IDのみに行い通常IDには行わない。
#   匿名IDは一定期間(現状1週間)で変わるので古いNGIDはその有効性が薄れるが、
#   通常IDはアカウントを使い続ける限りNGIDの有効性は変わらない。
NGCommExpire184Only=false

# 各種ログ表示 (true/false)
#   trueなら各種ログを表示する。
#   NGWORD/NGIDは個別に指定する(NGWORD.txtと同様)。
NGCommLogging=false
NGCommLoggingNGID=false
NGCommLoggingNGWORD=false

# NGIDに自動追加 (true/false)
#   この値がtrueなら、NGWORDにマッチしたユーザーを自動的にNGIDに追加する。
#   NGWORDが単純だと意図しないNGIDの追加があるので注意する事。
NGCommAutoNGID=false

# ユーザーIDの表示 (true/false)
#   この値がtrueなら、各コメントの先頭にユーザーIDを表示する。
NGCommShowUserID=false

# NGコマンド (文字列)
#   NGにしたいコマンドを正規表現で記述する。空文字列なら何もしない。
#   空白文字も正規表現の一部なので注意する事。
NGCommNGCMD=
#   「世界の新着動画」のコメント全てをNGにしたい場合
#NGCommNGCMD=_live
#   文字サイズ指定付きの匿名コメントをNGにしたい場合
#NGCommNGCMD=184.+(small|big)

# NGにマッチしたコメントを表示 (true/false)
#   この値がtrueなら、マッチしたコメントの冒頭に文字列"[NG] "を付加して
#   コメント自体は削除しない。
#   プレイヤー側のNG設定に"[NG] "を追加することで表示の切り替えが出来る。
NGCommShowMatched=true

# kill @JUMP (true/false/all)
#   この値がtrueなら、totalRename v0.7以降の削除履歴情報を参照して、過去に
#   削除した動画や無視登録した動画への投稿者コメントによるジャンプをNGにする。
#   
#   この値がallなら、全ての投稿者コメントによるジャンプをNGにする。
#   totalRenameを併用しない場合、trueを指定しても意味が無い。
NGCommKillJUMP=false

# 裏でプレイヤーのユーザーIDを削除 (秒)
#   この値を0より大きくすると、プレイヤーのNG設定からユーザーID登録した時に
#   指定秒数が経過すると、プレイヤーのNG設定から登録したユーザーIDを削除する。
#   NG登録した分を自動で削除するのでNG登録の上限を気にする必要が無くなるかも。
#   
#   また、この値が0より大きな時は、プレイヤーのNG設定から手動でユーザーIDを
#   削除すると、NGID.txtからも削除する(undo動作)。
#   なお、この時間をあまり短くすると動画視聴中に削除APIが呼び出されるため、
#   更に追加でNG登録すると動作中のプレイヤーでNGID登録分が復活するので注意。
#   
#   公式アニメ配信も始まったので、余裕を持って1800秒(=30分)あたりを推奨。
NGCommBGDeleteNGID=0

# thumbinfoをログに表示 (true/false)
#   この値がtrueなら、ログにgetthumbinfoの結果を表示する。
#   NGWORDのthumbinfo=を記述する時の参考にでもどうぞ。
NGCommShowThumbInfo=false

# 最新コメントのみにNGを適用 (true/false)
#   この値がtrueなら、マイメモリーや過去ログ取得にNGを適用しない。
#   NGCMDにマッチするような職人コメをマイメモリーで見る時に有効かも。
NGCommLatestOnly=false

# 統計情報を保持する数
#   この値を0より大きくすると、コメント処理の際に統計情報を保持するようになる。
#   保持した統計情報はAPIを介して取得できる。統計情報の保持にかかる処理時間は
#   無視できる程度だがメモリは消費するので、0を指定すれば一切処理しない。
NGCommStatMax=5

# 統計情報の集計間隔 (秒)
#   APIで統計情報を取得する際に、この値で指定した間隔で集計した統計情報を返す。
#   APIのパラメータ(&every=N)で指定した場合はそちらが有効。
#   この値に0を指定した場合、動画の総時間に応じて自動で間隔を調整する。
NGCommStatEvery=0

# デバッグモード
#   この値がtrueなら、デバッグログを出力する。また、NicoCacheフォルダ直下に
#   確認用のコメントファイル(NGComm_{original|modified}.xml)を出力する。
NGCommDebug=false
