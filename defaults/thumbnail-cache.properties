# NicoCache_nl サムネイル・メタデータキャッシュ設定
#
# 現行の nicovideo.cdn.nimg.jp サムネイルはファイル単位で保存します。

# サムネイルをディスクへキャッシュします。
cacheThumbnail=true

# サムネイルキャッシュフォルダー。
thcacheFolder=thcache

# サムネイル取得の転送タイムアウト（ミリ秒）。5000 以上を指定します。
thcacheTimeout=10000

# ブラウザーへ返すサムネイルのキャッシュ期間（日）。0 は追加指定なしです。
thcacheExpires=150

# 大サイズのサムネイルも保存します。
thcacheLargeSize=true

# 上流が 404 を返した場合に使用する代替画像またはリダイレクト URL。
thcacheReplace404=https://nicovideo.cdn.nimg.jp/web/img/common/video_deleted.jpg

# ext.nicovideo.jp/api/getthumbinfo 応答をメモリーへキャッシュします。
cacheGetThumbInfo=true
cacheGetThumbInfoMax=100
cacheGetThumbInfoExpire=1800

# 外部サムネイル・埋め込み応答をメモリーへキャッシュします。
cacheExtThumb=true
cacheExtThumbMax=500
cacheExtThumbExpire=3600
