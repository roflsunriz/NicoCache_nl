# NicoCache_nl コンテンツ書き換え設定
#
# 変更する場合は同じキーを config.properties に記述してください。

# DirectoryWatcher が無効な場合の nlFilter 更新確認間隔（ミリ秒）。
nlFilterCheckInterval=5000

# Content-Type に charset がない応答を書き換える際の既定文字セット。
rewriterDefaultCharset=ISO-8859-1

# NicoCache_nl 自身への直接リクエストでローカル資材を配信します。
localFileServer=true

# ローカル資材にも MatchLocal = TRUE の nlFilter を適用します。
localRewriter=true

# ローカル資材の Content-Type 定義。
mimeTypes=local/mime.types

# 書き換え対象の Content-Type に部分一致する正規表現。
rewriterContentType=^text/|javascript|/xml|/json|application/x-www-form-urlencoded

# Content-Type 判定前に書き換え対象外とする URL 拡張子。
rewriterExtIgnore=gif|jpe?g|png|bmp|ico|flv|mp4|swf

# 読み込まない nlFilter ファイル名に部分一致する正規表現。
nlFilterIgnore=^99_3列Filter(_mine)?\.txt$

# この時間（ミリ秒）以上を要したフィルターをログへ表示します。0 は無効です。
slowFilter=2000

# 書き換え処理時間の上位をログへ表示します。
enableFilterProfiler=false
