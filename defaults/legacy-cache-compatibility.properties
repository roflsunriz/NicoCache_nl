# 旧形式の動画キャッシュとの互換設定
#
# 現行の Domand/CMAF 配信に新規作成される設定ではありません。既存利用者が保存済みの
# 単一ファイル・旧 DMC キャッシュを引き続き利用できるよう、互換判定だけを保持します。

# 再エンコードされていない旧単一ファイルキャッシュを現行要求への応答候補にします。
useNotReEncodedCache=true

# より適切なキャッシュの保存後、低品質な再エンコード済み旧キャッシュを整理します。
removeReEncodedCache=true

# 現行候補よりビットレートが高い再エンコード済み旧キャッシュを利用候補にします。
useHighBitrateReEncodedCache=true

# ローカル変換で生成した動画の保存先。
convertedCacheFolder=cvcache
