# NicoCache_nl 動画キャッシュ設定
#
# 変更する場合は同じキーを config.properties に記述してください。

# 動画キャッシュフォルダー。空の場合は利用者データルートの cache を使います。
cacheFolder=

# 空き容量がこの値（MiB）を下回る場合、新規キャッシュを停止します。
needFreeSpace=100

# 新規キャッシュのファイル名へ動画タイトルを含めます。
title=true

# ファイル名に使うタイトルの全半角・連続空白を整えます。
tidyTitle=true

# ファイル名で表現できない文字を判定する Java 文字セット。空は Unicode 扱いです。
fileNameCharset=

# キャッシュ保存時に nlFilter の StoreFilter を適用します。
storeFilter=false

# キャッシュ利用時にファイルの更新時刻を更新します。
touchCache=true

# 外部で行われたキャッシュの移動・削除を監視します。
checkRealCache=true

# 音声抽出ファイル名に動画キャッシュのタイトルを使います。
useDownloadCacheName=true

# キャッシュ管理ページのテンプレート。空の場合は local/list.html、続いて内蔵版を使います。
templateFile=

# キャッシュ置換時に置換前ファイルの最終更新日時を引き継ぎます。
keepCacheLastModified=false

# 起動時に動画キャッシュの合計サイズを表示します。
displayCacheSizeOnInitialize=true

# 動画キャッシュの保存と利用をともに無効化します。
disableVideoCacheSystem=false

# Domand/CMAF セグメントの保存進捗をログへ表示します。
showCaching=true
