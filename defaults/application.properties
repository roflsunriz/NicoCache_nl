# NicoCache_nl アプリケーション設定
#
# このファイルは更新時に上書きされます。設定を変更する場合は、同じキーを
# アプリケーションルートの config.properties に記述してください。

# 利用者データの保存先。初回セットアップが絶対パスを config.properties に保存します。
userDataRoot=

# config.properties、nlFilter、CORS 設定の更新監視を無効にします。
# 監視機構に問題がある場合だけ true にしてください。
disableDirectoryWatcher=false

# 実行中の JAR が更新された場合に終了するときの終了コード。0 は終了しません。
exitStatusIfJarModified=25

# GUI 上で連続する同一ログを圧縮表示します。
dedupeLogMessage=true
