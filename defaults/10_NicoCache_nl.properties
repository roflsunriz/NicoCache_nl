# NicoCache_nl 設定ファイル(文字コード判定用なのでこの行は削除しないこと)

# このファイルは、nl本体の設定のデフォルト値を記述したものです。
# バージョンアップで上書きされるので、このファイルを直接修正しないで下さい。
# 値を変更する場合は、config.properties にコピー･修正してください。

# ←のように # から始まる行は無視されます。

# これらの値は 動的に変更が反映されます([S]は除く)


# -------------------------- ネットワーク関係 --------------------------

# 受付ポート [S]
#	nlへの接続ポートを指定します
listenPort=8080

# 起動管理用ローカルAPIの受付ポート [S]
# 本体と起動管理アプリの通信専用です。常に127.0.0.1だけで待ち受けます。
# 0を指定すると空きポートを自動選択します。
controlPort=0

# セカンダリプロキシ
#	nlから接続するプロキシを設定します（オミトロンとか外部に出るプロキシとか）
#	使用しないときは、proxyHostを空にしてください
proxyHost=
proxyPort=8081
#	SSL通信でもセカンダリプロキシを通すかどうか (true/false)
proxySSL=false

# 接続元の限定 [S]
# nlに接続できるPCを限定します
#	local	自PC
#	all		全IP
#	lanA	プライベートIP (10.xxx.xxx.xxx）
#	lanB	プライベートIP（172.16.xxx.xxx 〜 172.31.xxx.xxx）
#	lanC	プライベートIP（192.168.xxx.xxx） ←普通これ
#	lan		lanCと同じ
allowFrom=local

# 接続先の限定 (true/false)
#	trueにすると、nl経由でnicovideo.jp, smilevideo.jp, nimg.jp以外に
#	接続出来なくします
niconicoMode=false

# キャッシュからの送信速度の制限（Mbps単位)
#	HDDがガリガリいう対策に。プレミアムは実質30くらいです
#	0で無制限。設定可能値は8〜1000
speedLimit=0

# ブラウザからのデータ待ちうけタイムアウト。(ミリ秒)
#	Linux系ではこの値を0にしないとFDを食い潰して落ちる現象が報告されています
readTimeout=600000


# ------------------------- キャッシュ保存関係 -------------------------

# キャッシュフォルダの指定 [S]
#	パスの区切り"\"は"\\"にエスケープ必須です。"/"でも可能
#	標準の設定 (cache) を使用する場合は指定しないかコメントアウトしてください
cacheFolder=

# キャッシュフォルダのディスク容量制限 (MB単位)
#	空き容量が一定値を下回ると新たなキャッシュを停止します
#	MB (1024*1024バイト) 単位で指定。デフォルトは 100MB で停止
needFreeSpace=100

# キャッシュを予めディスクに確保する (true/false)
#	DL前に動画サイズを確定することで、断片化を減少させます
cacheAllocateFirst=true

# キャッシュのファイル名にタイトルを入れる (true/false)
#	title=trueで入れる、falseで入れません
#	この設定は「新しくDLするキャッシュ」について適用されます
# tidyTitle=trueとすると、取得したタイトルを整形して利用します
#	両端のスペースを削除したのち、
#	全角英数字を半角に、複数の連続したスペースを1つの半角スペースにまとめます
title=true
tidyTitle=true

# ファイル名に使う文字セット
#	空にするとUnicodeです。(Javaの文字セット名)
#	ファイル名に使えない文字を予めエスケープする際の文字コードです
#	指定値はこの辺を参考に：http://msugai.fc2web.com/java/IO/charset.html
fileNameCharset=

# キャッシュのストア時に簡易振り分けを実行する (true/false)
#	trueで実行する、falseで実行しない（キャッシュフォルダに入る）
#	仕様はページを参照してください
storeFilter=false

# キャッシュの動画を見た際に、更新時間を最新にする (true/false)
#	エクスプローラで見た順に並び替えなどに
touchCache=false

# 途中まで取得した動画を次に見るときに、残りの部分からDLを再開する (true/false)
resumeDownload=true

# キャッシュの移動･削除を追跡する (true/false)
#	エクスプローラなどで外部からキャッシュを移動･削除すると、
#	通常は再起動かキャッシュ一覧を表示させないと反映されませんが、
#	それを自動で追跡します
#	通常動作に影響は無いですが、キャッシュの移動･削除を検出した場合は
#	キャッシュ毎に検索するので、フォルダごと移動すると重くなるので注意
checkRealCache=false

# ------------------------------ 再生支援 ------------------------------

# ローカルFLVサーバ機能 (true/false)
#	flvplayer_wrapperのローカルFLVに必要な /cache/ フォルダの動作を行います
#	/cache/<smid>.flv のアクセスに対してキャッシュを返すようになります
#	trueで有効、falseで無効
localFlv=true

# ------------------------- ページ置換・その他 -------------------------

# ページにスクリプトを埋め込む [S]
#	On=1で動作。On=0で無効
#	Targetは置換対象のページのパスにマッチする正規表現です。誤爆に注意
#	Textは埋め込むタグです。=はエスケープして\=にします
#	ローカルファイルを参照させる場合は local フォルダにファイルを入れ、
#	/local/filename.txt のように参照させてください
scriptOn=1
scriptTarget=/watch/[^ ]+
# 例: scriptText=<script type\="text/javascript" charset\="utf-8" src\="/$TS(local/script.js)"></script>
scriptText=

# 内蔵のSearchExtensionを使用する (true/false)
#	キーワードで検索した際に、キャッシュからの検索結果も表示させます
#	trueで有効。falseで無効
useSearchExtension=true

# キャッシュからの検索結果の最大表示数を指定する
#	検索結果がこの数よりも多い時は、検索結果の先頭から指定件数のみ表示します
searchResultMax=300

# タグ検索結果のページにキャッシュからの検索結果を埋め込む
#	キャッシュからはタイトルの一部が一致するかどうかで検索されます
#	使用する際は、searchResultMaxを減らした方が良いかも(デフォルト300件)
insertSearchResultToTagPage=false

# 音声抽出時にキャッシュファイルのタイトルを利用する (true/false)
#	trueで有効。falseで無効
useDownloadCacheName=true

# キャッシュ管理ページで利用するテンプレートを指定する
#	何も指定しない場合、/local/list.html があればそちらを利用(ListXなど)、
#	存在しなければ内蔵のテンプレートを利用します
#	他のキャッシュ管理ソフト(cacheManagerなど)を利用する時は
#		templateFile=/local/listCacheManager.html
#	の様に指定してください
templateFile=


# ----------------------------- サムネ関係 -----------------------------

# サムネイルをnlでキャッシュする (true/false) [S]
#	サムネイルをキャッシュして、検索ページの表示を高速化します
#	trueで有効。falseで無効
cacheThumbnail=false

# サムネイルキャッシュ有効時に起動を高速化する (true/false) [S]
#	キャッシュのインデックスを保存して、次回の起動を高速化します
#	trueで有効。falseで無効
quickThumbnailCache=true

# サムネイルキャッシュの方法 (file/folder) [S]
#	cacheThumbnail=true の時にサムネイルをキャッシュする方法を指定します
#	folder を指定した場合は指定フォルダ以下にファイル単位でキャッシュ、
#	それ以外なら従来通り単一ファイル thcache.dat にキャッシュします
thcacheMode=file

# サムネイルキャッシュフォルダの指定 [S]
#	thcacheMode=folder の時にサムネイルキャッシュを保存するフォルダを指定します
#	Windows系のパス区切り"\"は"\\"にエスケープ必須です。"/"でも可能
thcacheFolder=thcache

# サムネイルキャッシュの更新時刻修正 (true/false)
#	この値をtrueにすると、各サムネイルキャッシュの更新時刻がepochの場合は
#	サムネイルを取得し直してファイルの更新時刻をLast-Modifiedに設定します
#	thcache.dat から変換したファイルの更新時刻を設定したい場合に有効ですが、
#	別にepochのままでも問題は無いので、気にならないなら指定しない方が良いです
thcacheFixEpoch=false

# 代替サムネイルの指定
#	thcacheMode=folder の時、全てのサムネ鯖が404を返す場合に、
#	ここで指定した代替サムネイルを次回以降キャッシュとして利用します
#	代替サムネイルは対応する位置にコピーするので、切り替えが出来るわけではありません
#	http://〜で始まる文字列を指定した場合はそのURLへのリダイレクトを返します
thcacheReplace404=http://res.nimg.jp/img/common/video_deleted.jpg


# サムネイル取得のデバッグ表示を行うか (true/false)
swfDebug=false


# ------------------------ メモリキャッシュ関係 ------------------------

# api/getthumbinfoの結果をメモリにキャッシュする (true/false)
#	諸般の都合で常に最新のものが欲しい時はfalseに
cacheGetThumbInfo=true

# api/getthumbinfoを最大何件キャッシュするか
cacheGetThumbInfoMax=100

# api/getthumbinfoキャッシュの寿命(秒単位)
cacheGetThumbInfoExpire=1800
# ユーザーデータの保存先
#	相対パスはNicoCache_nlのアプリケーションフォルダーを基準にします。
#	初回セットアップで絶対パスがconfig.propertiesへ保存されます。
userDataRoot=
